<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Downloader</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-slate-950 text-white">


    <!-- Header -->

    <header class="border-b border-slate-800">

        <div
            class="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between"
        >

            <div>

                <h1 class="text-xl font-bold">
                    YouTube Downloader
                </h1>

                <p class="text-sm text-slate-400">
                    Download YouTube videos and audio
                </p>

            </div>

        </div>

    </header>


    <!-- Main -->

    <main class="max-w-4xl mx-auto px-6 py-12">


        <!-- Hero -->

        <section class="text-center mb-10">

            <h2
                class="text-4xl md:text-5xl font-bold tracking-tight"
            >
                Download YouTube Videos
            </h2>

            <p
                class="mt-4 text-slate-400 max-w-xl mx-auto"
            >
                Paste a YouTube URL and download the video
                or extract its audio.
            </p>

        </section>


        <!-- URL Input -->

        <section
            class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl"
        >

            <label
                for="url"
                class="block text-sm font-medium mb-2"
            >
                YouTube URL
            </label>


            <div class="flex flex-col md:flex-row gap-3">

                <input
                    id="url"
                    type="url"
                    placeholder="https://www.youtube.com/watch?v=..."
                    class="flex-1 px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500"
                >


                <button
                    id="fetchBtn"
                    onclick="fetchVideoInfo()"
                    class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-medium transition"
                >
                    Get Video
                </button>

            </div>


            <!-- Error -->

            <div
                id="error"
                class="hidden mt-4 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm"
            ></div>


        </section>


        <!-- Video Preview -->

        <section
            id="videoCard"
            class="hidden mt-6 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden"
        >

            <div class="md:flex">


                <!-- Thumbnail -->

                <div class="md:w-2/5">

                    <img
                        id="thumbnail"
                        class="w-full h-full object-cover"
                        alt="Video thumbnail"
                    >

                </div>


                <!-- Information -->

                <div class="p-6 flex-1">

                    <h3
                        id="videoTitle"
                        class="text-xl font-semibold"
                    ></h3>


                    <p
                        id="channel"
                        class="mt-2 text-slate-400"
                    ></p>


                    <p
                        id="duration"
                        class="mt-1 text-sm text-slate-500"
                    ></p>


                </div>

            </div>


            <!-- Download Options -->

            <div
                class="border-t border-slate-800 p-6"
            >

                <div class="grid md:grid-cols-2 gap-4">


                    <!-- Type -->

                    <div>

                        <label
                            class="block text-sm text-slate-400 mb-2"
                        >
                            Format
                        </label>

                        <select
                            id="mediaType"
                            onchange="toggleQuality()"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700"
                        >

                            <option value="video">
                                Video MP4
                            </option>

                            <option value="audio">
                                Audio MP3
                            </option>

                        </select>

                    </div>


                    <!-- Quality -->

                    <div id="qualityContainer">

                        <label
                            class="block text-sm text-slate-400 mb-2"
                        >
                            Quality
                        </label>

                        <select
                            id="quality"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700"
                        >

                            <option value="360">
                                360p
                            </option>

                            <option value="480">
                                480p
                            </option>

                            <option value="720" selected>
                                720p
                            </option>

                            <option value="1080">
                                1080p
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Download Button -->

                <button
                    id="downloadBtn"
                    onclick="downloadVideo()"
                    class="w-full mt-6 px-6 py-4 rounded-xl bg-green-600 hover:bg-green-500 font-semibold transition"
                >
                    Download
                </button>


                <!-- Loading -->

                <div
                    id="loading"
                    class="hidden mt-6"
                >

                    <div class="flex justify-between items-center mb-2">

                        <span
                            id="loadingText"
                            class="text-sm text-slate-400"
                        >
                            Preparing download...
                        </span>

                        <span
                            id="progressPercentage"
                            class="text-sm font-semibold text-blue-400"
                        >
                            0%
                        </span>

                    </div>


                    <div
                        class="w-full h-3 bg-slate-800 rounded-full overflow-hidden"
                    >

                        <div
                            id="progressBar"
                            class="h-full bg-blue-600 rounded-full transition-all duration-300"
                            style="width: 0%"
                        ></div>

                    </div>


                    <div
                        class="flex justify-between mt-2 text-xs text-slate-500"
                    >

                        <span id="downloadSpeed">
                            --
                        </span>

                        <span id="downloadEta">
                            --
                        </span>

                    </div>

                </div>


                <!-- Result -->

                <div
                    id="result"
                    class="hidden mt-5 p-5 rounded-xl bg-green-500/10 border border-green-500/30"
                >

                    <p
                        class="text-green-400 font-medium"
                    >
                        Download completed!
                    </p>

                    <a
                        id="downloadLink"
                        href="#"
                        class="inline-block mt-3 px-5 py-2.5 rounded-lg bg-green-600 hover:bg-green-500 font-medium"
                    >
                        Download File
                    </a>

                </div>

            </div>

        </section>


    </main>


    <footer
        class="border-t border-slate-800 mt-20"
    >

        <div
            class="max-w-5xl mx-auto px-6 py-6 text-center text-sm text-slate-500"
        >
            YouTube Downloader
        </div>

    </footer>


    <script src="/static/js/app.js"></script>

</body>

</html>
